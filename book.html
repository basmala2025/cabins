<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booking</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="BookContainer">
        <div class="headerContainer">
            <div class="DivLogo"><a href=""><img src="img/logo4.png" alt="" class="Logo"></a></div>
            <div class="Header">
                <a href="index.html" class="link" target="_blank">Home</a>
                <a href="" class="link">Offers</a>
                <a href="" class="link">Our Brands</a>
                <a href="" class="link">About US</a>
                <a href="join.html" class="link" target="_blank">Join</a>
            </div>
        </div>
        <div class="Content">
            <form>
                <div class="row">
                    <div>
                        <label class="label">Destination :</label>
                        <select name="options" id="" class="select">
                            <option value="op1">Sharm El sheikh</option>
                            <option value="op2">Alexandria</option>
                            <option value="op3">Ain Sokhna</option>
                            <option value="op4">Hurghada</option>
                            <option value="op5">Port Said</option>
                        </select>
                        <label for="" class="label">From :</label>
                        <input type="date" class="select"   >
                        <label for="" class="label">To :</label>
                        <input type="date" class="select">
                    </div>
                </div>
                <div class="row">
                    <div>
                        <label for="num" class="label">Rooms :</label>
                        <input type="number" id="num" class="select2" min="1" max="50">
                    </div>
                    <div>
                        <label for="num2" class="label">Guests :</label>
                        <input type="number" id="num2" class="select2" min="1" max="50" placeholder="Adults">
                        <input type="submit" value="Find" class="buttonSubmit2">
                    </div>
                </div>
            </form>
        </div>
    </div>

</body>
</html>

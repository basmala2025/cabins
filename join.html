<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link rel="stylesheet" href="style.css">
</head>
<body style="background-image: url(img/bg1op.jpg);">
    <div class="headerContainer">
        <div class="DivLogo"><a href=""><img src="img/logo4.png" alt="" class="Logo"></a></div>
        <div class="Header">
            <a href="index.html" class="link" target="_blank">Home</a>
            <a href="" class="link">Offers</a>
            <a href="" class="link">Our Brands</a>
            <a href="" class="link">About US</a>
            <a href="join.html" class="link">Join</a>
        </div>
    </div>
    <form>
        <div style="width: 30%; height: 65%; background-color: white; margin-left: 32%; border-radius: 20px;     
       box-shadow: 10px 2px 9px 5px gray; margin-top: 3%;">
       <div style="margin-left: 60px; width: 80%;"> 
        <label style="font-size:0.4cm; margin-top: 2%;" >Name : </label>
        <input type="text" required placeholder="name"  style="margin-top: 10%; width: 70%; height: 5%; margin-left: 10%;">
        </div>
        <!-- div1 -->
       <div style="margin-left: 45px; width: 80%;"> 
        <label style="font-size:0.4cm; margin-top: 2%; margin-left: 3%;" >E-mail : </label>
        <input type="email" required placeholder="e-mail"  style="margin-top: 10%; width: 70%; height: 5%; margin-left: 10%;">
        </div>
        <!-- div2 -->
       <div style="margin-left: 50px; width: 80%;"> 
        <label style="font-size:0.4cm; margin-top: 2%;" >Password : </label>
        <input type="password" required placeholder="password"  style="margin-top: 10%; width: 70%; height: 5%; margin-left: 7%;">
        </div>
        <!-- div3 -->
        <label style="font-size:0.4cm; margin-top: 5%; margin-left: 11%;">Country :</label>
        <select name="Country" id="" style="margin-left: 35px; margin-top: 5%;">
            <option value="eg">Egypt</option>
            <option value="s">United States</option>
            <option value="c">China</option>
            <option value="cu">Cuba</option>
            <option value="f">France</option>
        </select>
      <div style="margin-left: 47px; margin-top: 40px;">
          <input type="radio" name="Gender" id="n">
        <label for="n">Male</label>
    </div>
       <div style="margin-left: 47px; margin-top: 10px;">
        <input type="radio" name="Gender" id="g">
        <label for="g">Female</label>
       </div>
       <div><input type="submit" value="Sign UP" class="buttonSign"></div>
    </div>
    </form>
</body>
</html>
